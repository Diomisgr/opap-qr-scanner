<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allwyn Tsirogiannis - POS Barcode</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <!-- Ενσωμάτωση βιβλιοθήκης Tesseract.js για αυτόματη ανάγνωση κειμένου από φωτογραφία -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #0056b3; margin-top: 0; margin-bottom: 10px; }
        p.instructions { color: #555; margin-bottom: 20px; font-size: 15px; line-height: 1.4; }
        
        input[type="text"] { width: 100%; padding: 18px; font-size: 20px; text-align: center; border: 2px solid #0056b3; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; letter-spacing: 1px; }
        
        .btn { border: none; color: white; background-color: #28a745; padding: 18px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .btn-lens { background-color: #0056b3; }
        
        #loading { display: none; font-weight: bold; color: #0056b3; margin: 15px 0; font-size: 16px; }
        #barcode-container { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; background: #fafafa; }
        svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Γρήγορο POS Barcode</h1>
        <p class="instructions">Κάνε επικόλληση τον κωδικό RF ή τράβα φωτογραφία για αυτόματη ανάγνωση.</p>
        
        <input type="text" id="rf-input" placeholder="Επικόλληση εδώ (RF...)" autocomplete="off">
        <button class="btn" onclick="makeBarcode()">Δημιουργία Barcode</button>
        
        <input type="file" id="lens-file" accept="image/*" capture="environment" style="display:none;" onchange="processImage(this)">
        <button class="btn btn-lens" onclick="document.getElementById('lens-file').click()">📸 Φωτογραφία & Αυτόματη Ανάγνωση</button>
        
        <div id="loading">⏳ Ανάγνωση κωδικού από τη φωτογραφία...</div>

        <div id="barcode-container">
            <svg id="barcode"></svg>
            <button class="btn" style="background-color: #6c757d; margin-top: 15px;" onclick="resetScanner()">🔄 Νέο Σκανάρισμα</button>
        </div>
    </div>

    <script>
        const rfInput = document.getElementById('rf-input');

        function makeBarcode() {
            let val = rfInput.value.trim().toUpperCase();
            val = val.replace(/[^A-Za-z0-9]/g, '');

            if (val.length >= 20) {
                document.getElementById('barcode-container').style.display = 'block';
                JsBarcode("#barcode", val, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 3,
                    height: 130,
                    displayValue: true,
                    margin: 10
                });
            } else {
                alert("Ο κωδικός φαίνεται ελλιπής. Βεβαιώσου ότι έκανες σωστή επικόλληση.");
            }
        }

        async function processImage(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('loading').style.display = 'block';
                document.getElementById('barcode-container').style.display = 'none';

                try {
                    // Χρήση Tesseract OCR για εξαγωγή κειμένου από τη φωτογραφία
                    const result = await Tesseract.recognize(file, 'eng');
                    let text = result.data.text;
                    
                    // Καθαρισμός κειμένου (κρατάμε μόνο γράμματα και αριθμούς)
                    let cleanText = text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();

                    if (cleanText.length >= 20) {
                        rfInput.value = cleanText;
                        document.getElementById('loading').style.display = 'none';
                        makeBarcode();
                    } else {
                        document.getElementById('loading').style.display = 'none';
                        alert("Δεν μπόρεσα να διαβάσω καθαρά τον κωδικό. Δοκίμασε να ξανατραβήξεις πιο κοντινή φωτογραφία ή κάνε επικόλληση.");
                    }
                } catch (error) {
                    document.getElementById('loading').style.display = 'none';
                    alert("Προέκυψε σφάλμα κατά την επεξεργασία της εικόνας.");
                }
            }
        }

        function resetScanner() {
            rfInput.value = "";
            document.getElementById('barcode-container').style.display = 'none';
            document.getElementById('lens-file').value = "";
            rfInput.focus();
        }
    </script>
</body>
</html>
