<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>POS Barcode</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:12px;background:#f0f2f5;color:#333;margin:0}
.container{max-width:760px;margin:auto;background:#fff;padding:12px;border-radius:12px}
h1{font-size:22px;color:#0056b3}
.btn{border:0;color:#fff;background:#28a745;padding:15px;border-radius:8px;font-size:18px;font-weight:bold;width:100%;margin:7px 0}
.blue{background:#0056b3}.gray{background:#6c757d}
#photo{display:none;width:100%;max-height:60vh;object-fit:contain;margin:10px 0;border-radius:8px}
textarea{width:100%;box-sizing:border-box;min-height:120px;font-size:18px;padding:10px}
input{width:100%;box-sizing:border-box;padding:15px;font-size:20px;text-align:center;border:2px solid #0056b3;border-radius:8px}
#barcode{display:none;margin-top:15px;padding:10px;background:#fff}
</style>
</head>
<body>
<div class="container">
<h1>Γρήγορο POS Barcode</h1>
<p>Τράβα φωτογραφία μέσα από την εφαρμογή. Η εφαρμογή διαβάζει μόνο τη φωτογραφία και καθαρίζει τον κωδικό.</p>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
<button class="btn blue" onclick="document.getElementById('photoInput').click()">📸 ΤΡΑΒΑ ΦΩΤΟΓΡΑΦΙΑ</button>

<img id="photo">
<div id="status"></div>

<div id="ocrBox" style="display:none;text-align:left">
<b>Κείμενο που διαβάστηκε:</b>
<textarea id="ocrText"></textarea>
<button class="btn blue" onclick="copyOCR()">📋 ΑΝΤΙΓΡΑΦΗ</button>
</div>

<input id="code" placeholder="Κωδικός">
<button class="btn" onclick="makeBarcode()">ΔΗΜΙΟΥΡΓΙΑ BARCODE</button>

<div id="barcode">
<img id="barcodeImg" style="max-width:100%">
<button class="btn gray" onclick="resetAll()">🔄 ΝΕΟ</button>
</div>
</div>

<script>
const input=document.getElementById('code');
const status=document.getElementById('status');
const photo=document.getElementById('photo');

document.getElementById('photoInput').addEventListener('change',async e=>{
 const f=e.target.files&&e.target.files[0]; if(!f)return;
 photo.src=URL.createObjectURL(f); photo.style.display='block';
 status.textContent='Διαβάζω τη φωτογραφία...';
 const img=new Image(); img.onload=async()=>{
   const canvas=document.createElement('canvas');
   const max=1800, s=Math.min(1,max/img.width);
   canvas.width=Math.round(img.width*s); canvas.height=Math.round(img.height*s);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   try{
     const r=await Tesseract.recognize(canvas,'eng',{tessedit_pageseg_mode:'6',tessedit_char_whitelist:'RF0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.- '});
     const raw=r.data.text||'';
     document.getElementById('ocrBox').style.display='block';
     document.getElementById('ocrText').value=raw;
     const found=findCode(raw);
     if(found){input.value=clean(found);status.textContent='Έτοιμο. Έλεγξε τον αριθμό πριν το Barcode.';}
     else status.textContent='Δεν βρέθηκε αυτόματα. Αντέγραψε/έλεγξε το κείμενο παραπάνω.';
   }catch(err){status.textContent='Σφάλμα ανάγνωσης.'}
 };
 img.src=photo.src;
});

function clean(v){return v.toUpperCase().replace(/[\s.\-–—_/:;,]+/g,'').replace(/[^A-Z0-9]/g,'');}
function findCode(raw){
 let m=raw.toUpperCase().match(/RF\s*[:\-]?\s*([0-9][0-9\s.\-]{15,})/);
 if(m)return 'RF'+m[1];
 let nums=[...raw.matchAll(/(?:^|[^0-9])(\d[\d\s.\-]{19,})(?!\d)/g)].map(x=>x[1]).filter(x=>clean(x).length>=20);
 return nums.length===1?nums[0]:null;
}
async function copyOCR(){
 const t=document.getElementById('ocrText').value;
 try{await navigator.clipboard.writeText(t);status.textContent='✅ Αντιγράφηκε.'}
 catch(e){document.getElementById('ocrText').select();document.execCommand('copy');status.textContent='✅ Αντιγράφηκε.'}
}
function makeBarcode(){
 const v=clean(input.value);
 if(v.length<6){status.textContent='Βάλε τον κωδικό.';return}
 input.value=v;
 document.getElementById('barcode').style.display='block';
 document.getElementById('barcodeImg').src='https://bwipjs-api.metafloor.com/?bcid=code128&text='+encodeURIComponent(v)+'&scale=3&rotate=N&includetext=false';
 status.textContent='✅ Barcode έτοιμο.';
}
function resetAll(){
 document.getElementById('photoInput').value='';
 photo.style.display='none';document.getElementById('ocrBox').style.display='none';
 document.getElementById('ocrText').value='';input.value='';
 document.getElementById('barcode').style.display='none';status.textContent='';
}
</script>
</body>
</html>
