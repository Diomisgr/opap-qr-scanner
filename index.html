<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allwyn Tsirogiannis - POS Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #0056b3; margin-top: 0; margin-bottom: 10px; }
        p.instructions { color: #555; margin-bottom: 20px; font-size: 15px; line-height: 1.4; }
        
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 15px; }
        .btn { border: none; color: white; background-color: #0056b3; padding: 18px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
        
        #status-text { font-weight: bold; margin-bottom: 15px; font-size: 16px; min-height: 24px; }
        .error { color: #d9534f; }
        .success { color: #5cb85c; }
        .warning { color: #f0ad4e; }
        
        #barcode-container { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; background: #fafafa; }
        #rf-text { font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; word-break: break-all; }
        svg { max-width: 100%; height: auto; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>POS Scanner Λογαριασμών</h1>
        <p class="instructions">Πάτα το κουμπί, τράβα φώτο τον κωδικό RF ή το QR και περίμενε 1-2 δευτερόλεπτα.</p>
        
        <div class="upload-btn-wrapper">
            <button class="btn">📸 Λήψη Φωτογραφίας</button>
            <input type="file" id="file-input" accept="image/*" capture="environment">
        </div>
        
        <p id="status-text"></p>
        
        <div id="barcode-container">
            <p id="rf-text"></p>
            <svg id="barcode"></svg>
            <button class="btn" style="background-color: #6c757d; margin-top: 15px;" onclick="location.reload()">🔄 Νέο Σκανάρισμα</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const barcodeContainer = document.getElementById('barcode-container');
        const rfText = document.getElementById('rf-text');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Επεξεργασία φωτογραφίας...";
            statusText.className = "warning";
            barcodeContainer.style.display = "none";

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const max_size = 1200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > max_size || height > max_size) {
                        const ratio = Math.min(max_size / width, max_size / height);
                        width = width * ratio;
                        height = height * ratio;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // 1. Έλεγχος για QR Code (ακαριαίο)
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code) {
                        processText(code.data);
                    } else {
                        // 2. Ανάγνωση κειμένου αν δεν έχει QR
                        statusText.innerText = "Ανάγνωση κωδικού RF...";
                        
                        const processedImage = canvas.toDataURL('image/jpeg', 0.9);

                        Tesseract.recognize(
                            processedImage,
                            'eng', 
                            { 
                                logger: m => {
                                    if (m.status === 'recognizing text') {
                                        let progress = Math.round(m.progress * 100);
                                        statusText.innerText = "Ανάγνωση: " + progress + "%";
                                    }
                                }
                            }
                        ).then(({ data: { text } }) => {
                            processText(text);
                        }).catch(err => {
                            statusText.innerText = "Σφάλμα ανάγνωσης. Δοκίμασε ξανά.";
                            statusText.className = "error";
                        });
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processText(text) {
            if (!text) {
                showError();
                return;
            }

            let clean = text.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            let directMatch = clean.match(/RF\d{23}/);
            let finalRf = "";

            if (directMatch) {
                finalRf = directMatch[0];
            } else {
                let rfIndex = clean.indexOf("RF");
                if (rfIndex !== -1) {
                    let afterRf = clean.substring(rfIndex + 2, rfIndex + 2 + 25);
                    let repaired = afterRf
                        .replace(/[OQ]/g, '0')
                        .replace(/[I1l]/g, '1')
                        .replace(/[Z]/g, '2')
                        .replace(/[S]/g, '5')
                        .replace(/[B]/g, '8');
                        
                    let repairedMatch = repaired.match(/^\d{23}/);
                    if (repairedMatch) {
                        finalRf = "RF" + repairedMatch[0];
                    }
                }
            }

            if (finalRf.length === 25) {
                statusText.innerText = "Επιτυχία!";
                statusText.className = "success";
                barcodeContainer.style.display = "block";
                rfText.innerText = finalRf;
                
                JsBarcode("#barcode", finalRf, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 3,
                    height: 120,
                    displayValue: true,
                    margin: 10
                });
            } else {
                showError();
            }
        }

        function showError() {
            statusText.innerText = "Δεν εντοπίστηκε καθαρός κωδικός RF. Βγάλε πιο κοντινή φωτογραφία.";
            statusText.className = "error";
        }
    </script>
</body>
</html>
