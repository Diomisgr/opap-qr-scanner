<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>POS Barcode</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:12px;background:#f0f2f5;color:#333;margin:0}
.container{max-width:760px;margin:auto;background:#fff;padding:12px;border-radius:12px}
h1{font-size:22px;color:#0056b3}
.btn{border:0;color:#fff;background:#28a745;padding:15px;border-radius:8px;font-size:18px;font-weight:bold;width:100%;margin:7px 0}
.blue{background:#0056b3}.gray{background:#6c757d}
#photo{display:none;width:100%;height:auto;max-height:65vh;object-fit:contain;margin:10px 0;border-radius:8px}
.crop-wrap{display:none;margin:10px 0;width:100%;height:62vh;min-height:360px;overflow:hidden;background:#222;border-radius:8px;position:relative}
.crop-wrap img{display:block;max-width:none;width:100%;height:100%;object-fit:contain}
.crop-wrap .cropper-container{width:100%!important;height:100%!important}
.crop-wrap .cropper-canvas,.crop-wrap .cropper-crop-box{max-width:none}
#cropBtn{display:none}
textarea{width:100%;box-sizing:border-box;min-height:120px;font-size:18px;padding:10px}
input{width:100%;box-sizing:border-box;padding:15px;font-size:20px;text-align:center;border:2px solid #0056b3;border-radius:8px}
#barcode{display:none;margin-top:15px;padding:10px;background:#fff}
</style>
</head>
<body>
<div class="container">
<h1>Γρήγορο POS Barcode</h1>
<p>Τράβα φωτογραφία μέσα από την εφαρμογή. Η εφαρμογή διαβάζει μόνο τη φωτογραφία και καθαρίζει τον κωδικό.</p>

<button class="btn blue" onclick="startCamera()">📸 ΑΝΟΙΞΕ ΚΑΜΕΡΑ</button>
<div id="cameraBox" style="display:none">
<video id="video" autoplay playsinline style="width:100%;border-radius:8px;background:#000"></video>
<button class="btn" onclick="takePhoto()">📸 ΤΡΑΒΗΞΕ ΦΩΤΟ</button>
</div>

<div class="crop-wrap" id="cropWrap">
<img id="photo">
</div>
<button id="cropBtn" class="btn" onclick="readSelected()" style="display:none">✂️ ΕΠΙΛΕΞΕ ΤΟΝ ΑΡΙΘΜΟ & ΔΙΑΒΑΣΕ</button>
<div id="status"></div>

<div id="ocrBox" style="display:none;text-align:left">
<b>Κείμενο που διαβάστηκε:</b>
<textarea id="ocrText"></textarea>
<button class="btn blue" onclick="copyOCR()">📋 ΑΝΤΙΓΡΑΦΗ</button>
</div>

<input id="code" placeholder="Κωδικός">
<button class="btn" onclick="makeBarcode()">ΔΗΜΙΟΥΡΓΙΑ BARCODE</button>

<div id="barcode">
<img id="barcodeImg" style="max-width:100%">
<button class="btn gray" onclick="resetAll()">🔄 ΝΕΟ</button>
</div>
</div>

<script>
const input=document.getElementById('code');
const status=document.getElementById('status');
const photo=document.getElementById('photo');

let cropper=null;
let stream=null;

async function startCamera(){
 try{
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
     status.textContent='❌ Η κάμερα δεν υποστηρίζεται εδώ.';
     return;
   }
   document.getElementById('cameraBox').style.display='block';
   status.textContent='Ζητάω άδεια για την κάμερα...';
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
   document.getElementById('video').srcObject=stream;
   status.textContent='Στόχευσε τον αριθμό RF και πάτησε «ΤΡΑΒΗΞΕ ΦΩΤΟ».';
 }catch(err){
   document.getElementById('cameraBox').style.display='none';
   status.textContent='❌ Δεν άνοιξε η κάμερα. Έλεγξε την άδεια κάμερας του Chrome.';
 }
}

function takePhoto(){
 const video=document.getElementById('video');
 if(!video.videoWidth){status.textContent='Περίμενε να ανοίξει η κάμερα.';return}
 const canvas=document.createElement('canvas');
 const max=2200;
 const s=Math.min(1,max/video.videoWidth);
 canvas.width=Math.round(video.videoWidth*s);
 canvas.height=Math.round(video.videoHeight*s);
 canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 document.getElementById('cameraBox').style.display='none';
 photo.src=canvas.toDataURL('image/jpeg',0.95);
 document.getElementById('cropWrap').style.display='block';
 document.getElementById('cropBtn').style.display='block';
 document.getElementById('ocrBox').style.display='none';
 status.textContent='Μεγάλωσε/μετακίνησε το πλαίσιο πάνω στον αριθμό RF. Η φωτογραφία είναι πλέον μεγάλη για να τον βλέπεις καθαρά.';
 photo.onload=()=>{
   if(typeof Cropper==="undefined"){status.textContent='❌ Δεν φορτώθηκε η επιλογή εικόνας.';return;}
   if(cropper) cropper.destroy();
   cropper=new Cropper(photo,{
     viewMode:1,autoCropArea:0.35,responsive:true,movable:true,zoomable:true,
     scalable:false,rotatable:false,background:false,guides:true,center:true,
     highlight:false,dragMode:'crop'
   });
 };
}

async function readSelected(){
 if(!cropper){status.textContent='Πρώτα βγάλε φωτογραφία.';return}
 const btn=document.getElementById('cropBtn');
 btn.disabled=true;
 status.textContent='⏳ Διαβάζω μόνο την επιλεγμένη περιοχή...';
 try{
   const canvas=cropper.getCroppedCanvas({maxWidth:1800,maxHeight:800,imageSmoothingEnabled:true,imageSmoothingQuality:'high'});
   const r=await Tesseract.recognize(canvas,'eng',{
     tessedit_pageseg_mode:'7',
     tessedit_char_whitelist:'RF0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.- '
   });
   const raw=(r.data.text||'').trim();
   document.getElementById('ocrBox').style.display='block';
   document.getElementById('ocrText').value=raw;
   const found=findCode(raw);
   if(found){
     input.value=clean(found);
     status.textContent='✅ Βρέθηκε ο αριθμός. Έλεγξέ τον και μετά δημιούργησε Barcode.';
   }else{
     input.value=clean(raw);
     status.textContent='⚠️ Δεν αναγνωρίστηκε καθαρά. Διόρθωσέ τον στο πεδίο «Κωδικός».';
   }
 }catch(err){
   status.textContent='❌ Σφάλμα ανάγνωσης της επιλογής.';
 }finally{
   btn.disabled=false;
 }
}

function clean(v){return v.toUpperCase().replace(/[\s.\-–—_/:;,]+/g,'').replace(/[^A-Z0-9]/g,'');}
function findCode(raw){
 let m=raw.toUpperCase().match(/RF\s*[:\-]?\s*([0-9][0-9\s.\-]{15,})/);
 if(m)return 'RF'+m[1];
 let nums=[...raw.matchAll(/(?:^|[^0-9])(\d[\d\s.\-]{19,})(?!\d)/g)].map(x=>x[1]).filter(x=>clean(x).length>=20);
 return nums.length===1?nums[0]:null;
}
async function copyOCR(){
 const t=document.getElementById('ocrText').value;
 try{await navigator.clipboard.writeText(t);status.textContent='✅ Αντιγράφηκε.'}
 catch(e){document.getElementById('ocrText').select();document.execCommand('copy');status.textContent='✅ Αντιγράφηκε.'}
}
function makeBarcode(){
 const v=clean(input.value);
 if(v.length<6){status.textContent='Βάλε τον κωδικό.';return}
 input.value=v;
 document.getElementById('barcode').style.display='block';
 document.getElementById('barcodeImg').src='https://bwipjs-api.metafloor.com/?bcid=code128&text='+encodeURIComponent(v)+'&scale=3&rotate=N&includetext=false';
 status.textContent='✅ Barcode έτοιμο.';
}
function resetAll(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 document.getElementById('cameraBox').style.display='none';
 document.getElementById('cropWrap').style.display='none';
 document.getElementById('cropBtn').style.display='none';
 if(cropper){cropper.destroy();cropper=null}
 document.getElementById('ocrBox').style.display='none';
 document.getElementById('ocrText').value='';input.value='';
 document.getElementById('barcode').style.display='none';status.textContent='';
}
</script>
</body>
</html>
